[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unichess-kit"
version = "0.1.0"
description = "UniChess 共享管线：批量对弈、搜索、裁决、统计"
requires-python = ">=3.10"
dependencies = ["chess>=1.9", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["unichess_kit*"]

[tool.setuptools.package-data]
unichess_kit = ["data/*.txt"]
